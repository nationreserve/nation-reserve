items:
  - {explanation_id: EXP-FIN-VERIFIED, audience: [public_visitor, robot_owner, hiring_company], topic: "Verified operating pricing", purpose: "Separate verified operation from schedule and activation.", required_message: "Only verified operating seconds support charges and earnings; current hourly figures are prorated under the active financial version.", prohibited_or_misleading_message: ["Scheduled hours are paid", "Guaranteed earnings", "Guaranteed uptime"], pages: [/roboworkpool/pricing, /owner/earnings, /company/billing], components: [PricingExplanation], related_requirements: [RWP-TIME-0001, RWP-TIME-0002, RWP-TIME-0003], status: partial, review_notes: "Public pages are not implemented."}
  - {explanation_id: EXP-FIN-STATUS, audience: [robot_owner, hiring_company], topic: "Financial status terminology", purpose: "Prevent obligation and settlement states from being conflated.", required_message: "Accrued, invoiced, submitted, settled, paid, held, financially ready, and payout-ready are distinct states.", prohibited_or_misleading_message: ["Available balance when only accrued", "Paid when submitted", "Charged when only invoiced"], pages: [/owner/earnings, /company/billing], components: [FinancialPage, PaymentPage], related_requirements: [RWP-BILLING-0001, RWP-PAYOUT-0001], status: partial, review_notes: "Some authenticated guidance exists; systematic page audit remains."}
  - {explanation_id: EXP-MANUFACTURER-INTEGRATION, audience: [manufacturer, public_visitor], topic: "Manufacturer integration", purpose: "Explain credentials, native heartbeat integration, robot identity, fulfillment, and replacement.", required_message: "Manufacturers integrate through sandbox then approved production APIs; no separate tracking device is required.", prohibited_or_misleading_message: ["Automatic matching marketplace", "No integration required"], pages: [/roboworkpool/manufacturers, /manufacturer/application], components: [IntegrationPage], related_requirements: [RWP-ROBOT-0002, RWP-ROBOT-0003, RWP-CONTRACT-0001], status: partial, review_notes: "Public manufacturer page missing."}
  - {explanation_id: EXP-NATION-RESERVE, audience: [public_visitor], topic: "Nation Reserve and product structure", purpose: "Explain shared identity and product navigation.", required_message: "Nation Reserve is the account and product family; RoboWorkPool, Republic, and Med Pool are distinct products.", prohibited_or_misleading_message: ["RoboWorkPool is an open bidding marketplace"], pages: [/, /roboworkpool, /republic, /med-pool], components: [PublicShell, PublicPage, Orientation], related_requirements: [RWP-WEB-0001, RWP-CORE-0001], status: implemented, review_notes: "Implemented in Prompt 013; external Republic publication URL remains pending."}

  - {explanation_id: EXP-SHELL-CONTEXT, audience: [robot_owner, hiring_company, manufacturer, platform_staff], topic: "Organization, role, availability, and safe next steps", purpose: "Keep acting context and recovery understandable.", required_message: "The active organization and role control visible navigation; maintenance, restriction, and feature states explain what is unavailable and the safest next action.", prohibited_or_misleading_message: ["Hidden navigation guarantees authorization", "Unavailable means data was lost"], pages: [/account, /organizations/select], components: [OrganizationSwitcher, RestrictedPage, MaintenancePage, ServiceIntroduction], related_requirements: [RWP-UX-0001, RWP-AUTH-0001], status: implemented, review_notes: "Role-page placement remains assigned to later screen prompts."}
  - {explanation_id: EXP-ACCOUNT-CONTEXT, audience: [public_visitor, authenticated_user], topic: "Nation Reserve account and organization context", purpose: "Explain shared identity, verification, organization choice, roles, and security recovery.", required_message: "A Nation Reserve account is shared across authorized products; organization membership determines role, permissions, and data context.", prohibited_or_misleading_message: ["Creating an account automatically approves an organization", "Hidden navigation proves authorization", "Password recovery confirms an account exists"], pages: [/register, /login, /verify-email, /organizations/select, /account], components: [SharedAccountPage, AuthenticationShell, OrganizationSwitcher], related_requirements: [RWP-CORE-0001, RWP-AUTH-0001, RWP-AUTHUX-0001], status: implemented, review_notes: "Backend contract gaps are explicitly disclosed."}