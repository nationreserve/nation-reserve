name: Isolated preview environment
on:
  pull_request: {types: [opened, synchronize, reopened, closed]}
permissions: {contents: read, id-token: write, pull-requests: write}
concurrency: {group: "preview-${{ github.event.pull_request.number }}", cancel-in-progress: false}
jobs:
  preview:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.9.8}
      - name: Validate isolation guard
        env: {DEPLOY_ENVIRONMENT: preview, NODE_ENV: production, DATABASE_URL: "${{ secrets.PREVIEW_DATABASE_URL }}", REDIS_URL: "${{ secrets.PREVIEW_REDIS_URL }}", S3_BUCKET: "rwp-preview-${{ github.event.pull_request.number }}", WEB_ORIGIN: "https://pr-${{ github.event.pull_request.number }}.preview.example.invalid", PAYMENT_PROVIDER: fake, PAYMENT_PROVIDER_ENVIRONMENT: test, PAYMENT_EXECUTION_ENABLED: "false", COOKIE_SECURE: "true", TIMELINE_PROJECTION_ENABLED: "true"}
        run: node scripts/release/validate-environment.mjs
      - working-directory: infrastructure/terraform/environments/preview
        run: terraform init -backend-config="${{ secrets.TF_PREVIEW_BACKEND_CONFIG }}" && terraform workspace select -or-create "pr-${{ github.event.pull_request.number }}"
      - if: github.event.action != 'closed'
        working-directory: infrastructure/terraform/environments/preview
        run: terraform apply -auto-approve -var="preview_id=pr-${{ github.event.pull_request.number }}" -var="certificate_arn=${{ secrets.PREVIEW_CERTIFICATE_ARN }}" -var="image_tag=${{ github.sha }}"
      - if: github.event.action == 'closed'
        working-directory: infrastructure/terraform/environments/preview
        run: terraform destroy -auto-approve -var="preview_id=pr-${{ github.event.pull_request.number }}" -var="certificate_arn=${{ secrets.PREVIEW_CERTIFICATE_ARN }}" -var="image_tag=${{ github.sha }}"
