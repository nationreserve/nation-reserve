server{listen 8080;server_name _;root /usr/share/nginx/html;index index.html;server_tokens off;add_header X-Content-Type-Options nosniff always;add_header Referrer-Policy strict-origin-when-cross-origin always;add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;location = /healthz{access_log off;return 200 'ok';add_header Content-Type text/plain;}location /assets/{try_files $uri =404;expires 1y;add_header Cache-Control "public, immutable";}location /{try_files $uri /index.html;add_header Cache-Control "no-store";}}
